# ==============================================================================
# Docker Compose Orchestration
# Telco Customer Churn Intelligence & Retention Platform
# Services: PostgreSQL 16, FastAPI Microservice, Streamlit Dashboard
# ==============================================================================

version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Relational Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: telco_churn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-telco_churn_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-telco_churn_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - telco_network

  # ----------------------------------------------------------------------------
  # 2. FastAPI Prediction & Analytics Microservice
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: telco_churn_api
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-telco_churn_db}
      USE_SQLITE_FALLBACK: "False"
      ACTIVE_MODEL_PATH: artifacts/models/calibrated_xgb_pipeline.joblib
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - telco_network

  # ----------------------------------------------------------------------------
  # 3. Streamlit Executive Dashboard
  # ----------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: telco_churn_dashboard
    restart: unless-stopped
    environment:
      APP_ENV: production
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-telco_churn_db}
      USE_SQLITE_FALLBACK: "False"
      API_HOST: api
      API_PORT: 8000
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - telco_network

volumes:
  postgres_data:
    driver: local

networks:
  telco_network:
    driver: bridge
